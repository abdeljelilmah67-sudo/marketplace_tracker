name: Mercari Tracker

on:
  workflow_dispatch:

jobs:
  tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r marketplace_tracker/requirements.txt

      - name: Lancer le tracker
        working-directory: marketplace_tracker
        run: python marketplace_tracker.py